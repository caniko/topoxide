[package]
name = "topoxide"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Deterministic layered graph renderer for scientific ETL and data-model figures"
repository = "ssh://git@codeberg.org/caniko/topoxide.git"

[[bin]]
name = "topoxide"
path = "src/main.rs"

[features]
default = []
leptos = ["dep:leptos"]
ssr = ["leptos", "leptos/ssr"]
hydrate = ["leptos", "leptos/hydrate"]

[dependencies]
clap = { version = "4", features = ["derive"] }
leptos = { version = "=0.8.19", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
