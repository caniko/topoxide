[package]
name = "topoxide"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Deterministic layered graph renderer for scientific ETL and data-model figures"
repository = "ssh://git@codeberg.org/caniko/topoxide.git"

[[bin]]
name = "topoxide"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
